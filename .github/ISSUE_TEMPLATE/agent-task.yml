name: "🤖 Agent task"
description: "Ask OpenClaw Intelligence to do something. The title is pre-filled with the @ trigger prefix."
title: "@ "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This issue triggers **OpenClaw Intelligence**.

        - Keep the leading `@ ` in the title — it is the routing signal that
          activates the agent. Without it, no agent will respond.
        - Only collaborators with write access (or higher) can trigger the agent.
        - To invoke a specific skill, start the task with `/skill-name`
          (for example `/gh-issues` or `/summarize`).

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What kind of task is this? This gives the agent useful context.
      options:
        - Question / explanation
        - Code change / bug fix
        - Investigation / analysis
        - Documentation
        - Maintenance / chore
        - Other
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe what you want the agent to do. Be specific and include any relevant files, paths, or constraints.
      placeholder: |
        e.g. "Add input validation to the login form in src/auth/login.ts and explain what you changed."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Links, error logs, acceptance criteria, or anything else that helps.
    validations:
      required: false
